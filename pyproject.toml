[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mfscope"
version = "0.1.0"
description = "India Mutual Fund Intelligence Engine — data pipeline, ML scoring, dark-mode dashboard"
requires-python = ">=3.11"
dependencies = [
    # HTTP / scraping
    "httpx==0.27.0",
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.2.2",
    "playwright==1.44.0",
    "feedparser==6.0.11",

    # Database
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "asyncpg==0.29.0",

    # API
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "python-dotenv==1.0.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.0",

    # Scheduling
    "apscheduler==3.10.4",

    # NLP / ML
    "transformers==4.41.2",
    "torch==2.3.1",
    "vaderSentiment==3.3.2",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.0",
    "xgboost==2.0.3",
    "lightgbm==4.3.0",
    "shap==0.45.1",

    # Utilities
    "tenacity==8.3.0",
    "rich==13.7.1",
    "loguru==0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "httpx==0.27.0",
    "ruff==0.4.9",
    "mypy==1.10.0",
    "ipykernel==6.29.4",
    "jupyter==1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
